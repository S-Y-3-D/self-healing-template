name: Bug report
description: Propose a fix for discussion and supervised testing.
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small example and relevant environment details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Who is affected?
      description: Explain the practical impact and any workaround.

name: Heal commands
on:
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: write
concurrency:
  group: heal-command-state
  cancel-in-progress: false
  queue: max
jobs:
  command:
    environment: heal-control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record controls and dispatch explicit authorized commands
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_STATE_PRIVATE_KEY: ${{ secrets.HEAL_STATE_PRIVATE_KEY }}
          HEAL_ENABLED: ${{ vars.HEAL_ENABLED }}
        run: node .self-heal/bin/heal.mjs route

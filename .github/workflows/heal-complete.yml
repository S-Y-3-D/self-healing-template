name: Heal command result
on:
  workflow_run:
    workflows: [Heal issue triage, Heal test proposal, Heal implementation, Heal verify and publish]
    types: [completed]
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read
concurrency:
  group: heal-command-state
  cancel-in-progress: false
  queue: max
jobs:
  result:
    environment: heal-control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record outcome and show next human action without AI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_STATE_PRIVATE_KEY: ${{ secrets.HEAL_STATE_PRIVATE_KEY }}
        run: node .self-heal/bin/heal.mjs complete

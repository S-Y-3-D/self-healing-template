name: Heal verify and publish
run-name: 'Heal publication for ${{ github.event.workflow_run.display_title }}'
on:
  workflow_run:
    workflows: [Heal implementation]
    types: [completed]
permissions: {}
concurrency:
  group: heal-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.HEAL_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authenticate generator run and current approvals
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .self-heal/bin/heal.mjs source-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heal-candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate candidate and collect immutable snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_TEST_PR: ${{ steps.source.outputs.test_pr }}
          HEAL_OUTPUT: ${{ runner.temp }}/prepared
        run: node .self-heal/bin/heal.mjs prepare "$RUNNER_TEMP/candidate/.heal-candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heal-prepared
          path: ${{ runner.temp }}/prepared/payload.json
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heal-prepared
          path: ${{ runner.temp }}/prepared
      - name: Prepare runtime before disabling candidate network access
        run: docker pull node:22-bookworm-slim
      - name: Verify baseline, regression and candidate in isolated containers
        env:
          HEAL_OUTPUT: ${{ runner.temp }}/verified
        run: node .self-heal/bin/heal.mjs verify "$RUNNER_TEMP/prepared/payload.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: heal-failure
          path: ${{ runner.temp }}/verified/failure.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heal-verified
          path: ${{ runner.temp }}/verified/verified.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: heal-publish
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heal-verified
          path: ${{ runner.temp }}/verified
      - name: Recheck current authorization and publish exact verified content
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_OUTPUT: ${{ runner.temp }}/publication
          HEAL_ENABLED: ${{ vars.HEAL_ENABLED }}
        run: node .self-heal/bin/heal.mjs publish "$RUNNER_TEMP/verified/verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heal-publication
          path: ${{ runner.temp }}/publication/publication.json
          retention-days: 30

name: Heal setup check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check GitHub configuration without reading secrets or calling AI
        env:
          GH_TOKEN: ${{ secrets.HEAL_SETUP_TOKEN || github.token }}
        run: node .self-heal/bin/heal.mjs setup
